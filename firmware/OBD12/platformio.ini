; PlatformIO build for OBD12.
;
; Builds the same sources as the STM32CubeIDE project (no PlatformIO framework):
; the HAL, CMSIS and BlueNRG-2 middleware come from this directory, exactly as
; CubeMX generated them. Keep include paths / defines in sync with .cproject.

[platformio]
src_dir = .
include_dir = Core/Inc
default_envs = obd12

[env:obd12]
platform = platformio/ststm32@19.7.1
board = nucleo_g431kb
; the platform's default toolchain is GCC 7; use a modern GCC like CubeIDE does
platform_packages = platformio/toolchain-gccarmnoneeabi@1.140201.0
board_build.ldscript = STM32G431KBTX_FLASH.ld

build_src_filter =
	-<*>
	+<Core/Src/>
	+<Core/Startup/>
	+<Drivers/STM32G4xx_HAL_Driver/Src/>
	+<BlueNRG-2/Target/>
	+<Middlewares/ST/BlueNRG-2/hci/>
	+<Middlewares/ST/BlueNRG-2/utils/>

build_flags =
	-DUSE_HAL_DRIVER
	-DSTM32G431xx
	-ICore/Inc
	-IDrivers/STM32G4xx_HAL_Driver/Inc
	-IDrivers/STM32G4xx_HAL_Driver/Inc/Legacy
	-IDrivers/CMSIS/Device/ST/STM32G4xx/Include
	-IDrivers/CMSIS/Include
	-IMiddlewares/ST/BlueNRG-2/hci/hci_tl_patterns/Basic
	-IMiddlewares/ST/BlueNRG-2/utils
	-IMiddlewares/ST/BlueNRG-2/includes
	-IBlueNRG-2/Target
	-Os
	-g3
	-ffunction-sections
	-fdata-sections
	-Wall
	--specs=nano.specs
	-Wl,-u,_printf_float
	-Wl,--gc-sections
	-Wl,-Map,${BUILD_DIR}/firmware.map
	-Wl,--print-memory-usage

; adds the hard-float FPU flags to compile, assemble and link steps
extra_scripts = pre:pio_fpu.py

upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
