# Publishes software/web to GitHub Pages (Web Bluetooth needs HTTPS).
# Repository settings: Pages > Build and deployment > Source = GitHub Actions.

name: Deploy web app

on:
  push:
    branches: [master]
    paths:
      - "software/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages lets browsers cache files for 10 minutes, and a reload refetches
      # index.html but may reuse old scripts; new URLs per commit prevent mixing
      - name: Version asset URLs
        working-directory: software/web
        run: |
          v=${GITHUB_SHA::8}
          sed -i -E "s/(src|href)=\"(app\.js|style\.css)\"/\1=\"\2?v=$v\"/" index.html
          sed -i -E "s#from \"\./(obd12|pids|vin)\.js\"#from \"./\1.js?v=$v\"#" *.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: software/web
      - id: deployment
        uses: actions/deploy-pages@v4
